[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray("res://game/scenes/main.tscn")
include_filter="game/art/runtime/*,game/art/animation/*,game/fonts/GoblinHand-game.ttf,game/licenses/*,game/audio/*,game/data/*"
exclude_filter="game/art/source/*,game/fonts/*-source.ttf,game/fonts/NotoSansSC-*,game/fonts/MaShanZheng-*,game/tests_*.gd,game/art/jobs.json,package.json,package-lock.json,icon.svg"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"><style>html,body,canvas{touch-action:none;overscroll-behavior:none}body{background:#202c26}#status{background:#202c26!important}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=2
