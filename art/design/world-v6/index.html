<script>const pages=[['center','部落中心与首领生命'],['wooden-signs','未建造的插地木牌'],['wall-ghost','靠近后切换建筑虚影'],['partial-payment','逐枚投入，费用暂存'],['refunded','走开后退回未完成投币'],['stall-worker','工匠摊，木槌与木料'],['stall-hunter','猎手摊，弓箭与靶子'],['stall-brute','打手摊，盾牌与战具'],['stall-thief','盗贼摊，紫篷与钥匙'],['shop-worker','工匠专属工具面板'],['shop-hunter','猎手专属工具面板'],['shop-brute','打手专属工具面板'],['shop-thief','盗贼专属工具面板'],['merchant-760','金币商人的高位金币标识'],['merchant-970','援军商人的双盔标识'],['merchant-1180','坐骑商人的马鞍标识'],['prison-trader','加高监牢与囚车停靠处'],['grounded-wreck','真实落地的破损车队'],['tall-defense','加高箭台与驻守位置'],['healing','白天回到安全大厅疗伤'],['hall-ruin','大厅废墟仍可维修'],['chief-hurt','受击扣生命，金币不抵伤'],['chief-defeat','首领阵亡后免费重开'],['small-tools','较短横屏中的工具面板']];for(const[id,title]of pages){const f=document.createElement('figure'),a=document.createElement('a'),im=new Image(),c=document.createElement('figcaption');a.href='../../../qa/world-v6/'+id+'.png';im.src=a.href;im.alt=title;im.loading='lazy';a.append(im);c.textContent=title;f.append(a,c);document.getElementById('shots').append(f)}</script></html>
