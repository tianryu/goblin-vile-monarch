<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横屏手游 设计与实机对照</title>
<style>@font-face{font-family:Goblin;src:url('../../../game/fonts/GoblinHand-game.ttf')}*{box-sizing:border-box}body{margin:0;background:#25342e;color:#f3e8cd;font:18px/1.7 Goblin,system-ui}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:32px;font-weight:400}h2{font-size:24px;font-weight:400;margin:8px 0}a{color:#e9bc6b}nav{display:flex;gap:14px;flex-wrap:wrap}figure{margin:32px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;border:1px solid #657166}figcaption{padding:8px 0;color:#c6c7b0;font-size:16px}.label{font-size:16px;margin-bottom:8px;color:#ddc99f}@media(max-width:850px){.pair{grid-template-columns:1fr}}</style>
<main><h1>我是哥布林：君主 横屏布局对照</h1><p>23张逐页设计图，与按设计调整后的Godot截图。主要确认键在右下，返回在左下。商品卡先选择，再从底部确认。</p><nav><a href="http://127.0.0.1:42820/">进入新版试玩</a><a href="../../../release/goblin-monarch-web.zip">下载Web包</a><a href="../../../docs/INTERACTION_REWORK_V5.md">本轮改动与验收</a></nav><p>右侧为桌面浏览器中的实际游戏验收场景，金额、装备和战果会随存档变化。设计图是布局原型，截图是运行证据，二者分别保存。</p><div id="list"></div></main>
<script type="module">import{pages}from'./layouts.js';const runtime={world:'coin-ghost-empty',loading:'release-loading',error:'release-error',rotate:'rotate',victory:'960-victory',defeat:'960-defeat','guide-1':'960-guide','guide-2':'960-guide-2','guide-3':'960-guide-3','guide-4':'960-guide-4'};
for(const p of pages){const f=document.createElement('figure');const actual=runtime[p.id]||'960-'+p.id;f.innerHTML='<h2>'+p.title+'</h2><div class="pair"><div><div class="label">布局设计图</div><img loading="lazy" src="'+p.id+'.png" alt="'+p.title+'设计图"></div><div><div class="label">Godot运行截图</div><img loading="lazy" src="../../../qa/interaction-v5/'+actual+'.png" alt="'+p.title+'游戏运行截图"></div></div><figcaption>'+(p.subtitle||'')+'</figcaption>';document.getElementById('list').append(f)}
</script></html>
