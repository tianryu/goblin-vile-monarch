<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>布局原型</title>
<style>
@font-face{font-family:GoblinHand;src:url('../../../game/fonts/GoblinHand-game.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:GoblinHand,sans-serif}#stage{position:relative;width:960px;height:480px;background:#536660 url('world-base.png') center/cover;color:#f4e7c7;overflow:hidden}.shade{position:absolute;inset:0;background:rgba(22,34,28,.66)}.title{position:absolute;left:36px;top:16px;font-size:34px;line-height:44px}.subtitle{position:absolute;left:38px;right:36px;top:57px;font-size:20px;line-height:26px;color:#e7dcc1}.sheet{position:absolute;left:24px;top:90px;width:912px;height:262px;background:url('../../../game/art/runtime/ui_panel_v5.png') center/100% 100% no-repeat}.body{position:absolute;left:40px;top:104px;width:880px;height:232px;display:flex;align-items:center;justify-content:center;gap:14px;color:#3f4735}.card{height:232px;flex:1;position:relative;background:url('../../../game/art/runtime/ui_card_v5.png') center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;padding:13px 11px;gap:4px;text-align:center}.card.selected{background-image:url('../../../game/art/runtime/ui_card_selected_v5.png')}.art{height:104px;display:flex;align-items:center;justify-content:center}.card h3{font-size:23px;line-height:30px;font-weight:400;margin:0}.detail{font-size:18px;white-space:pre-line;line-height:23px;color:#666449}.price{display:flex;gap:5px;align-items:center;justify-content:center;font-size:22px;margin-top:auto}.footer{position:absolute;bottom:22px;height:64px;background:url('../../../game/art/runtime/ui_button_v5.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;color:#fff0cf;padding:5px 12px}.back{left:24px;width:140px}.primary{right:24px;width:220px;background-image:url('../../../game/art/runtime/ui_primary_v5.png')}.secondary{right:258px;width:184px}.aux{left:178px;width:156px}.feedback{position:absolute;left:40px;right:40px;bottom:94px;height:27px;text-align:center;color:#eddbad;font-size:18px}.welcome-logo{position:absolute;top:46px;left:300px;width:360px;height:248px;object-fit:contain}.welcome-line{position:absolute;top:310px;left:120px;right:120px;text-align:center;font-size:22px}.portrait{width:240px;height:196px;display:flex;justify-content:center;align-items:center}.lines{font-size:21px;line-height:42px;flex:1;padding-left:30px}.numbers{position:absolute;display:flex;gap:16px;align-items:center;background:url('../../../game/art/runtime/ui_tag_v5.png') center/100% 100% no-repeat;padding:8px 16px;font-size:22px}.hud-left{top:16px;left:24px;width:278px;height:48px}.day{top:14px;left:392px;width:176px;height:46px;font-size:20px;justify-content:center}.pause{position:absolute;right:24px;top:12px}.joystick{position:absolute;left:28px;bottom:28px}.knob{position:absolute;left:84px;bottom:46px}.run{position:absolute;right:236px;bottom:32px}.action{position:absolute;right:40px;bottom:24px}.action-label{position:absolute;bottom:4px;right:32px;width:110px;text-align:center;font-size:19px}.near{position:absolute;bottom:134px;right:24px;width:144px;text-align:center;font-size:20px;text-shadow:0 1px 2px #25342e}.coin-ghosts{position:absolute;left:388px;top:211px;display:flex;gap:5px}.coin-ghosts>div{opacity:.33}.blueprint{position:absolute;left:395px;top:252px;opacity:.32;filter:sepia(.4)}.toggles{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.toggle{height:78px;background:url('../../../game/art/runtime/ui_button_v5.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;font-size:23px;color:#f5e5c2}.ledger{width:100%;display:flex;flex-direction:column;gap:14px}.stats{display:flex;justify-content:space-around;font-size:23px}.roles{display:flex;justify-content:space-around}.role{display:flex;align-items:center;gap:8px;font-size:20px}.flags{display:flex;justify-content:space-around;font-size:20px}.loading-title{position:absolute;top:302px;left:200px;right:200px;font-size:24px;text-align:center}.loading-bar{position:absolute;left:270px;top:348px;width:420px;height:14px;background:url('../../../game/art/runtime/ui_bar.png') center/100% 100% no-repeat}.loading-fill{width:60%;height:100%;background:url('../../../game/art/runtime/ui_bar_fill.png') center/100% 100% no-repeat}.rotate .title{left:0;right:0;text-align:center;top:90px}.rotate .subtitle{text-align:center;top:260px}.rotate .rotate-art{position:absolute;top:165px;left:400px}
.joystick>div{width:164px!important;height:88px!important;background-size:164px 88px!important;background-position:0!important}
</style><div id="stage"></div>
<script type="module">
import{pages}from'./layouts.js';
const bank=await(await fetch('../../../game/art/runtime/manifest.json')).json();const page=pages.find(p=>p.id===new URLSearchParams(location.search).get('page'))||pages[0];const stage=document.getElementById('stage');
function sprite(name,h=90){const f=bank.frames[name]||bank.frames[name.split('_')[0]];if(!f)return document.createElement('div');const s=bank.sheets[f.sheet],scale=h/f.h,d=document.createElement('div');d.style.cssText=`width:${f.w*scale}px;height:${h}px;background:url('../../../game/art/runtime/${f.sheet}') ${-f.x*scale}px ${-f.y*scale}px/${s.width*scale}px ${s.height*scale}px no-repeat;flex-shrink:0`;return d}
function el(cls,text='',parent=stage){const d=document.createElement('div');d.className=cls;d.textContent=text;parent.append(d);return d}
function footer(){if(page.buttons){el('footer back',page.buttons[0]);el('footer primary',page.buttons[1]);if(page.secondary)el('footer secondary',page.secondary);if(page.leftAux)el('footer aux',page.leftAux)}}
if(page.type==='world'){
 let left=el('numbers hud-left');left.append(sprite('coin',25),document.createTextNode('18'),sprite('idle',26),document.createTextNode('6 / 20'));el('numbers day','第1日 白天');el('pause').append(sprite('ui_pause_control',56));el('joystick').append(sprite('ui_joystick_base',88));el('knob').append(sprite('ui_joystick_knob',51));el('run').append(sprite('ui_run_control',72));el('action').append(sprite('ui_action_control',96));el('action-label','投币');el('near','建造路障');el('blueprint').append(sprite('wall1',60));const slots=el('coin-ghosts');for(let i=0;i<4;i++)slots.append(sprite('coin',18));
}else{
 el('shade');
 if(['welcome','loading','error'].includes(page.type)){
  const logo=document.createElement('img');logo.className='welcome-logo';logo.src='../../../game/art/runtime/ui_logo.png';stage.append(logo);
  if(page.type==='welcome')el('welcome-line',page.subtitle);else el('loading-title',page.title);
  if(page.type==='loading'){let bar=el('loading-bar');el('loading-fill','',bar)}else footer();
 }else if(page.type==='rotate'){
  stage.classList.add('rotate');el('title',page.title);el('subtitle',page.subtitle);el('rotate-art').append(sprite('ui_joystick_base',88));
 }else{
  el('title',page.title);el('subtitle',page.subtitle||'');
  if(page.type!=='pause')el('sheet');const body=el('body');
  if(page.cards){for(let i=0;i<page.cards.length;i++){const [image,title,detail,price]=page.cards[i],card=el('card'+(i===(page.selected??-1)?' selected':''),'',body);el('art','',card).append(sprite(image,100));const t=document.createElement('h3');t.textContent=title;card.append(t);el('detail',detail,card);if(price){const p=el('price','',card);p.append(sprite('coin',20),document.createTextNode(price))}}}
  else if(['guide','message'].includes(page.type)){el('portrait','',body).append(sprite(page.image,178));const lines=el('lines','',body);for(const s of page.lines)el('',s,lines)}
  else if(page.type==='pause'){const t=el('toggles','',body);for(let s of ['部落账本','部落手册','声音 开','水面倒影 开','免费重新开始','鸣谢与许可'])el('toggle',s,t)}
  else if(page.type==='ledger'){let l=el('ledger','',body),a=el('stats','',l);for(let s of ['金币 18','储备 0','废铁 8','候补 0'])el('',s,a);let roles=el('roles','',l);for(const [n,label] of [['worker','工匠2'],['hunter','猎手3'],['brute','打手1'],['thief','盗贼0']]){let x=el('role','',roles);x.append(sprite(n,68),document.createTextNode(label))}let flags=el('flags','',l);for(let s of ['西营 军旗未夺回','东营 军旗未夺回'])el('',s,flags)}
  footer();
 }
}
await document.fonts.ready;window.designReady=true;
</script></html>
