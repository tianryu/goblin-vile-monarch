<script>const pages=[['release-start','正式包直接进入部落'],['day-scene','日光与三级部落'],['night-scene','月光、火炬与萤火'],['tool-one-coin','工具摊直接投入第一枚金币'],['tool-stocked','无人看管的工具摊挂出库存'],['treasury-withdraw','主厅金币堆与钱袋取用'],['whip-recovery','鞭打掉币，仍留在场景中'],['stream-and-willow','河桥与疏密树林'],['production-farm','蘑菇田与生产地带'],['gold-mine','林地中的金币矿'],['fallen-distinction','负伤活口与静止尸体'],['inline-pause','暂停原位切换图标'],['layout-740','740x360横屏布局'],['defeat','首领阵亡结算'],['victory','双旗通关结算'],['release-loading','独立位图启动幕'],['release-unsupported','无法启动时的简短重试']];for(const[id,title]of pages){const f=document.createElement('figure'),a=document.createElement('a'),im=new Image(),c=document.createElement('figcaption');a.href='../../../qa/world-v7/'+id+'.png';im.src=a.href;im.alt=title;im.loading='lazy';a.append(im);c.textContent=title;f.append(a,c);document.getElementById('shots').append(f)}</script></html>
