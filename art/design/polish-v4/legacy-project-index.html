<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#142536"><title>我是哥布林：君主</title><link rel="stylesheet" href="./src/style.css"></head><body><main id="game"><canvas id="world" aria-label="哥布林部落游戏场景"></canvas><div id="hud"><div id="resources"><span class="coin ui-icon ui-gold"></span> <b id="gold">12</b><span class="quiet">│ 储备 <b id="reserve">0</b> │</span><span class="goblin ui-icon ui-head"></span> <b id="people">0</b></div><div id="clock"><span id="day">第1日</span><div class="time-track"><i id="time-fill"></i></div><small id="phase">白昼</small></div><button id="pause" aria-label="暂停游戏"><span class="ui-icon ui-pause"></span></button></div><div id="target" hidden></div><div id="guide"></div><div id="toasts" aria-live="polite"></div><div id="controls"><div id="joystick" role="slider" aria-label="仅左右移动的摇杆" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div class="joy-track"></div><span class="joy-hint left">‹</span><span class="joy-hint right">›</span><div id="joy-knob"></div></div><div class="actions"><button id="run" class="round"><span class="ui-icon ui-run"></span><small>奔跑</small></button><button id="action" class="round main-action"><span id="action-icon" class="ui-icon ui-gold"></span><small id="action-label">投币</small></button></div></div><div id="overlay" hidden><section id="panel" role="dialog" aria-modal="true"></section></div><div id="rotate">请将手机横过来<br><small>你的部落，正在等你</small></div><div id="loading">正在点燃部落篝火…</div></main><script type="module" src="./src/main.js"></script></body></html>
