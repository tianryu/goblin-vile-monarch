</style></head><body><main><h1>我是哥布林：君主　平面手绘方向稿</h1><p>平面手绘画风已确认。本轮修正中世纪商人服饰、笼内关押遮挡和单人拖运。点图可放大。</p><nav><a href="../../../docs/GAME_DESIGN.md">整体玩法文档</a><a href="../../../docs/PERFORMANCE_BUDGET.md">手机性能预算</a><a href="../reboot-v2-flat/README.md">本轮修改与检查</a></nav><figure class="featured"><button data-src="../reboot-v2-flat/03-prison-medieval-corrected.png" aria-label="放大平面手绘监牢交易图"><img src="../reboot-v2-flat/03-prison-medieval-corrected.png" alt="中世纪监牢交易修正版：无帽套头短袍商人，俘虏在铁栏后，单人拖运"></button><figcaption><strong>监牢交易　中世纪细节修正版</strong><small>商人改穿束腰粗布短袍，四名俘虏完全在笼内，单名哥布林牵绳拖网。设计稿，不是实机截图。</small></figcaption></figure><details><summary>展开上一轮构图对照，旧画风已要求修改</summary><section>
<figure><button data-src="01-tribe-day-uglycute.png" aria-label="放大白天部落设计"><img src="01-tribe-day-uglycute.png" alt="白天部落：衣服口袋鼓起的哥布林与追赃交互"></button><figcaption><strong>01 白天部落与私藏追缴</strong><small>鼓口袋、骑乘首领、常驻商人；左侧水平摇杆，右侧靠近后抽鞭子。</small></figcaption></figure>
<figure><button data-src="02-prison-market-uglycute.png" aria-label="放大监牢交易设计"><img src="02-prison-market-uglycute.png" alt="监牢：联军俘虏、人类商人与拖网搬运的哥布林"></button><figcaption><strong>02 监牢与人类商人</strong><small>4/6收押容量、囚车、战后搬运；己方监牢关押联军，商人是人类。</small></figcaption></figure>
<figure><button data-src="03-night-defense-final.png" aria-label="放大夜间防守设计"><img src="03-night-defense-final.png" alt="夜间防线：路障、捕网、人类矮人精灵联军"></button><figcaption><strong>03 夜间防守与捕俘</strong><small>路障、猎手和吊网配合；敌人剑盾分手持握，俘虏受困在路面。</small></figcaption></figure>
<figure><button data-src="04-thief-outpost-uglycute-pixel.png" aria-label="放大敌营偷窃设计"><img src="04-thief-outpost-uglycute-pixel.png" alt="盗贼推走车轮，敌营车轴暴露，哥布林同族关在敌营笼中"></button><figcaption><strong>04 敌营偷轮与撤离</strong><small>缺轮军需车、赃物回运、被囚同族；大尖耳、歪鼻和坏笑的低像素角色。</small></figcaption></figure>
</section></details><footer>设计稿不进游戏资源包。性能预算需要后续实现与真机验证；最终图风格和UI由用户审阅确认。</footer></main><dialog id="viewer"><button id="close">关闭 ✕</button><img id="large" alt="放大的设计图"></dialog><script>const viewer=document.querySelector('#viewer'),large=document.querySelector('#large');document.querySelectorAll('[data-src]').forEach(button=>button.addEventListener('click',()=>{large.src=button.dataset.src;large.alt=button.querySelector('img').alt;viewer.showModal()}));document.querySelector('#close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});</script></body></html>
