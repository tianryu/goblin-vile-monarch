<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>显隐与可读性 实机审阅</title><style>body{margin:0;background:#202c26;color:#eee4c9;font:16px/1.7 system-ui}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:28px}a{color:#f3c974}p{max-width:980px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,450px),1fr));gap:24px}figure{margin:0;background:#304036;padding:12px}img{width:100%;height:auto;display:block}figcaption{padding:8px 4px}</style><main><h1>显隐与可读性 实机审阅</h1><p>当前Godot H5实际输出，部分为受控检查场景。过渡中间透明度另有绘制快照与操作验证，单张截图不代替动画时序证明。角色仍为静态贴图，没有制作帧动画。</p><p><a href="http://127.0.0.1:42820/">打开当前正式试玩</a>　<a href="../../../docs/VISIBILITY_TRANSITIONS.md">本轮实现与验收</a></p><div class="grid" id="shots"></div></main><script>const shots=[['visibility/merchant-caption','靠近商人，两行建筑名称与作用'],['visibility/transparent-purse','透明袋身，50枚金币错落放入'],['visibility/grounded-day','贴合地面的建筑、树根和金币堆'],['visibility/outlined-night','夜间人物描边与暖色火炬'],['visibility/ghost-enter','靠近建造点，金币与建筑虚影进入'],['visibility/ghost-exit','走开退款，旧提示淡出'],['world-v7/tool-stocked','工具摊直接挂出工具'],['world-v7/stream-and-willow','河桥和树林贴合地面'],['world-v7/release-start','最新正式包入口'],['world-v7/defeat','结算窗口与免费重开']];for(const[id,title]of shots){const f=document.createElement('figure'),a=document.createElement('a'),im=new Image(),cap=document.createElement('figcaption');a.href='../../../qa/'+id+'.png';im.src=a.href;im.alt=title;im.loading='lazy';cap.textContent=title;a.append(im);f.append(a,cap);document.getElementById('shots').append(f)}</script></html>
